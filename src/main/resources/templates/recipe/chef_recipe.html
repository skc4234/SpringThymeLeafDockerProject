<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style type="text/css">
.container {
	margin-top: 40px
}
.row {
	margin: 0px auto;
	width: 1000px;
}
p {
	overflow: hidden;
	white-space: nowrap;
	text-overflow: ellipsis;
}
.a-link {
	cursor: pointer;
}
</style>
<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script src="https://unpkg.com/axios/dist/axios.min.js"></script>
<script>
const chef_name='[[${chef}]]'
console.log(chef_name)
</script>
</head>
<body>
<div class="container" id="chef">
	<div class="row">
		<table class="table">
			<tr>
				<td class="text-center">
					<h3 style="color: orange;">[[${chef}]]
						<span style="font-size: 16px; color: black;">님의 레시피입니다</span>
					</h3>
				</td>
			</tr>
			<tr>
				<td class="text-right">
					<a href="javascript:history.back()" class="btn btn-sm btn-danger">목록</a>
				</td>
			</tr>
		</table>
	</div>
	<div class="row">
		<div class="col-sm-3" v-for="(vo,index) in list" :key="index">
			<div class="thumbnail">
			  <a @click="change(vo.no)">
				<img :src="vo.poster" :title="vo.title" style="width: 300px; height: 200px;">
			  </a>
				<p>{{vo.title}}</p>
			</div>
		</div>
	</div>
	<div class="row text-center">
		<ul class="pagination">
			<li v-if="startpage>1">
				<a @click="move(startpage-1)" class="a-link">&laquo;</a>
			</li>
			<li v-for="i in range(startpage,endpage)" :class="i==curpage?'active':''">
				<a @click="move(i)" class="a-link">{{i}}</a>
			</li>
			<li v-if="endpage<totalpage">
				<a @click="move(endpage+1)" class="a-link">&raquo;</a>
			</li>
		</ul>
	</div>
</div>
<script>
	let findApp=Vue.createApp({
		data(){
			return {
				list:[],
				curpage:1,
				totalpage:0,
				startpage:0,
				endpage:0,
				chef:chef_name
			}
		},
		mounted(){
			// 시작과 동시에 처리
			this.dataRecv()
		},
		methods:{
			// 사용자 정의 함수
			async dataRecv(){
				
				await axios.get('http://localhost:8080/recipe/chef_recipe_vue',{
					params:{
						page:this.curpage,
						chef:this.chef
					}
				}).then(response=>{
					console.log(response.data)
					this.list=response.data.list
					this.curpage=response.data.pages[0]
					this.totalpage=response.data.pages[1]
					this.startpage=response.data.pages[2]
					this.endpage=response.data.pages[3]
				})
			},
			move(page){
				this.curpage=page
				this.dataRecv()
			},
			range(start,end){
				let arr=[]
				let len=end-start
				for(let i=0; i<=len; i++) {
					arr[i]=start
					start++
				}
				return arr
			},
			change(no){
				location.href="/recipe/detail?no="+no
			}
		},
		components:{
			
		},
		computed:{
			// 완성된 계산 변경 => 1,000
		},
		watch:{
			// 컴포넌트에서 발생된 이벤트 처리
		}
	}).mount('#chef')
</script>
</body>
</html>
